<!--
  Modelo do e-mail que chega quando alguém usa o formulário do portfólio.
  Cole este código no EmailJS: Email Templates > seu modelo > Content > "Edit Content" > modo código (<>).
  Variáveis preenchidas pelo site: {{name}}, {{email}}, {{message}}, {{time}}.
  Usa tabelas e estilos inline porque é o que funciona no Gmail, Outlook e celular.
-->
<table role="presentation" width="100%" cellpadding="0" cellspacing="0" border="0" style="background-color:#0f172a;padding:32px 12px;font-family:Arial,Helvetica,sans-serif;">
  <tr>
    <td align="center">
      <table role="presentation" width="100%" cellpadding="0" cellspacing="0" border="0" style="max-width:560px;background-color:#1a1a2e;border-radius:16px;overflow:hidden;border:1px solid #2b3a55;">

        <!-- Faixa colorida -->
        <tr>
          <td style="height:6px;background-color:#00d9ff;background-image:linear-gradient(90deg,#00d9ff,#3b82f6);font-size:0;line-height:0;">&nbsp;</td>
        </tr>

        <!-- Cabeçalho -->
        <tr>
          <td style="padding:28px 32px 8px;">
            <p style="margin:0;color:#00d9ff;font-size:16px;font-weight:bold;font-family:'Courier New',monospace;">&lt;/&gt; Thiago Felix</p>
            <h1 style="margin:16px 0 4px;color:#ffffff;font-size:24px;line-height:1.3;">📩 Nova mensagem pelo portfólio</h1>
            <p style="margin:0;color:#94a3b8;font-size:14px;">Recebida em {{time}}</p>
          </td>
        </tr>

        <!-- Quem enviou -->
        <tr>
          <td style="padding:20px 32px 0;">
            <table role="presentation" width="100%" cellpadding="0" cellspacing="0" border="0" style="background-color:#16213e;border-radius:12px;">
              <tr>
                <td style="padding:18px 20px;">
                  <p style="margin:0 0 4px;color:#94a3b8;font-size:12px;text-transform:uppercase;letter-spacing:1px;">De</p>
                  <p style="margin:0;color:#ffffff;font-size:18px;font-weight:bold;">{{name}}</p>
                  <a href="mailto:{{email}}" style="color:#00d9ff;font-size:15px;text-decoration:none;">{{email}}</a>
                </td>
              </tr>
            </table>
          </td>
        </tr>

        <!-- Mensagem -->
        <tr>
          <td style="padding:20px 32px 0;">
            <p style="margin:0 0 8px;color:#94a3b8;font-size:12px;text-transform:uppercase;letter-spacing:1px;">Mensagem</p>
            <div style="border-left:4px solid #00d9ff;background-color:#16213e;border-radius:0 12px 12px 0;padding:18px 20px;color:#e2e8f0;font-size:16px;line-height:1.6;white-space:pre-wrap;">{{message}}</div>
          </td>
        </tr>

        <!-- Botão de responder -->
        <tr>
          <td align="center" style="padding:28px 32px;">
            <a href="mailto:{{email}}" style="display:inline-block;background-color:#00d9ff;background-image:linear-gradient(135deg,#00d9ff,#3b82f6);color:#ffffff;font-size:16px;font-weight:bold;text-decoration:none;padding:14px 32px;border-radius:8px;">Responder {{name}}</a>
          </td>
        </tr>

        <!-- Rodapé -->
        <tr>
          <td style="padding:16px 32px 24px;border-top:1px solid #2b3a55;">
            <p style="margin:0;color:#64748b;font-size:12px;line-height:1.5;text-align:center;">
              Enviado pelo formulário de contato do seu portfólio.<br />
              Você também pode clicar em "Responder" no seu e-mail para falar com {{name}}.
            </p>
          </td>
        </tr>

      </table>
    </td>
  </tr>
</table>
